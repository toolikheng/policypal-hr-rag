# Continuous integration: lint and test every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: policypal
          POSTGRES_PASSWORD: policypal-ci
          POSTGRES_DB: policypal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U policypal -d policypal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://policypal:policypal-ci@localhost:5432/policypal_test
      # Fail (instead of skip) if the database tests cannot reach PostgreSQL.
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  # Build the Docker image the way CD does and fail on HIGH/CRITICAL vulnerabilities
  # that have a fix, so they are caught on a branch, before they reach main.
  image-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: policypal:ci
          # Dependencies and the model come from the cache; the runtime stage (with its
          # apt-get upgrade) is always rebuilt, as in CD.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: runtime
      - run: sh scripts/scan-image.sh policypal:ci
