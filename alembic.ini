# Alembic configuration. The database URL is not stored here: migrations/env.py reads
# it from the DATABASE_URL setting. Logging is the app's JSON logging (see env.py).
[alembic]
script_location = %(here)s/migrations
# Lets the `alembic` command import the policypal package from the repository root.
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
