# PolicyPal services. Start everything with:  docker compose up --build
name: policypal

# One image for api and ui. EMBEDDING_MODEL is baked into the image at build time.
x-app-build: &app-build
  context: .
  args:
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:?set EMBEDDING_MODEL in .env (copy .env.example)}

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (copy .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env (copy .env.example)}
    ports:
      # Only reachable from this machine (127.0.0.1), whatever BIND_ADDRESS says: the
      # password in .env.example is public.
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: *app-build
    image: ${POLICYPAL_IMAGE:-policypal:local}
    env_file: .env
    environment:
      # Inside Compose the database host is the "db" service, not localhost.
      # (The db service above already stops Compose if these variables are missing.)
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # The same goes for Ollama. The api doesn't wait for it: until the model is ready,
      # answers quote the policy text and /health reports "degraded".
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      # 127.0.0.1 (this machine only) unless BIND_ADDRESS in .env says otherwise.
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      # Uploaded policies survive restarts and are re-ingested on start.
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # urlopen fails on a 503, so the container is "healthy" only when /health is ok or
      # degraded (the database works; the LLM may still be downloading).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      # The first start embeds every policy into an empty database and loads the embedding
      # model; with Ollama downloading at the same time this took about 80 s on the
      # development laptop. A passing check ends the start period early.
      start_period: 180s

  ui:
    build: *app-build
    image: ${POLICYPAL_IMAGE:-policypal:local}
    command:
      - streamlit
      - run
      - ui/Chat.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      API_URL: http://api:8000
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  ollama:
    # Runs the local LLM on the CPU. On the first start it downloads OLLAMA_MODEL
    # (about 2 GB for llama3.2:3b) into the ollama volume; later starts work offline.
    image: ollama/ollama:0.35.1
    entrypoint: ["/bin/sh", "/ollama-entrypoint.sh"]
    environment:
      PULL_MODEL: ${OLLAMA_MODEL:?set OLLAMA_MODEL in .env (copy .env.example)}
    ports:
      # Only reachable from this machine (127.0.0.1): Ollama has no authentication.
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
      - ./docker/ollama-entrypoint.sh:/ollama-entrypoint.sh:ro
    healthcheck:
      # Healthy once the model is downloaded. The long start period allows for a slow
      # first download; `docker compose up --wait` waits for it.
      test: ["CMD-SHELL", "ollama show \"$$PULL_MODEL\" > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30m

volumes:
  pgdata:
  uploads:
  ollama:
