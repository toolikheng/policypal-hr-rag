# PolicyPal services. Start everything with:  docker compose up --build
name: policypal

# One image for api and ui. EMBEDDING_MODEL is baked into the image at build time.
x-app-build: &app-build
  context: .
  args:
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:?set EMBEDDING_MODEL in .env (copy .env.example)}

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (copy .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env (copy .env.example)}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: *app-build
    image: ${POLICYPAL_IMAGE:-policypal:local}
    env_file: .env
    environment:
      # Inside Compose the database host is the "db" service, not localhost.
      # (The db service above already stops Compose if these variables are missing.)
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # The same goes for Ollama. The api doesn't wait for it: until the model is ready,
      # answers quote the policy text and /health reports "degraded".
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Uploaded policies survive restarts and are re-ingested on start.
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # urlopen fails on a 503, so the container is "healthy" only when /health is ok or
      # degraded (the database works; the LLM may still be downloading).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  ui:
    build: *app-build
    image: ${POLICYPAL_IMAGE:-policypal:local}
    command:
      - streamlit
      - run
      - ui/Chat.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      API_URL: http://api:8000
    ports:
      - "${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  ollama:
    # Runs the local LLM on the CPU. Downloaded models are kept in the ollama volume.
    image: ollama/ollama:0.35.1
    ports:
      # Only reachable from this machine (127.0.0.1): Ollama has no authentication.
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # One-off job: downloads OLLAMA_MODEL on the first start (about 2 GB for llama3.2:3b),
  # then exits. On later starts the model is already in the volume, so it exits at once.
  ollama-pull:
    image: ollama/ollama:0.35.1
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:?set OLLAMA_MODEL in .env (copy .env.example)}
    entrypoint: ["/bin/sh", "-c"]
    # $$ stops Compose from filling in the variable; the shell does it instead.
    command: ['ollama show "$$OLLAMA_MODEL" > /dev/null 2>&1 || ollama pull "$$OLLAMA_MODEL"']
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  uploads:
  ollama:
