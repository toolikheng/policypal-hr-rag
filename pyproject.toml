# Tool configuration only. Dependencies live in requirements*.txt.

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes errors, I: import order, B: common bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# -ra prints the reason for every skipped test, so skipped database tests are never silent.
addopts = "-ra"
